name: Build macOS app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Check installer syntax
        run: bash -n scripts/install.sh scripts/install-hermes-skill.sh
      - name: Install from source archive
        env:
          SCRIPTBAR_REF: ${{ github.head_ref || github.ref_name }}
          SCRIPTBAR_INSTALL_DIR: ${{ runner.temp }}/scriptbar-apps
          SCRIPTBAR_NO_OPEN: "1"
        run: bash scripts/install.sh
      - name: Verify installed app metadata
        run: /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/scriptbar-apps/ScriptBar.app/Contents/Info.plist"
