name: Build macOS app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Check installer syntax
        run: bash -n scripts/install.sh && bash -n scripts/install-hermes-skill.sh && bash -n scripts/install-copilot-skill.sh && bash -n scripts/install-codex-skill.sh
      - name: Install skill for Codex
        env:
          HOME: ${{ runner.temp }}/codex-home
          GH_CONFIG_DIR: ${{ runner.temp }}/codex-home/.config/gh
          GH_TOKEN: ${{ github.token }}
          SCRIPTBAR_SKILL_PIN: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/install-codex-skill.sh
          test -s "$HOME/.agents/skills/scriptbar/SKILL.md"
      - name: Install skill for GitHub Copilot
        env:
          HOME: ${{ runner.temp }}/copilot-home
          GH_CONFIG_DIR: ${{ runner.temp }}/copilot-home/.config/gh
          GH_TOKEN: ${{ github.token }}
          SCRIPTBAR_SKILL_PIN: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/install-copilot-skill.sh
          test -s "$HOME/.copilot/skills/scriptbar/SKILL.md"
      - name: Install from source archive
        env:
          SCRIPTBAR_REF: ${{ github.head_ref || github.ref_name }}
          SCRIPTBAR_INSTALL_DIR: ${{ runner.temp }}/scriptbar-apps
          SCRIPTBAR_NO_OPEN: "1"
        run: bash scripts/install.sh
      - name: Verify installed app metadata
        run: /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/scriptbar-apps/ScriptBar.app/Contents/Info.plist"
