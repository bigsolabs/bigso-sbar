name: Build macOS app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Check installer syntax
        run: bash -n scripts/install.sh
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Verify app bundle metadata
        run: /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' .build/ScriptBar.app/Contents/Info.plist
